name: GHCR Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - k8s/**
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The Dockerfile installs Google Chrome, which requires amd64.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # TypeScript compilation is checked by the Dockerfile's bun run build.
      # All service credentials are injected by Kubernetes at runtime.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/unorouter/uno-import:${{ github.sha }}
          cache-from: type=gha,scope=uno-import-amd64
          cache-to: type=gha,mode=max,scope=uno-import-amd64

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pin image for ArgoCD
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          file=k8s/deployment.yaml
          grep -q 'image: ghcr.io/unorouter/uno-import:' "$file"
          sed -i "s|image: ghcr.io/unorouter/uno-import:.*|image: ghcr.io/unorouter/uno-import:$IMAGE_SHA|" "$file"
          git config user.name unorouter-ci
          git config user.email ci@unorouter.com
          git add "$file"
          git diff --cached --quiet && exit 0
          git commit -m "deploy(uno-import): $IMAGE_SHA"
          for attempt in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1
