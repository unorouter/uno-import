name: GHCR Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - k8s/**
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The Dockerfile installs Google Chrome, which requires amd64.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # TypeScript compilation is checked by the Dockerfile's bun run build.
      # All service credentials are injected by Kubernetes at runtime.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/unorouter/uno-import:${{ github.sha }}
          cache-from: type=gha,scope=uno-import-amd64
          cache-to: type=gha,mode=max,scope=uno-import-amd64

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Pin image for ArgoCD
        env:
          IMAGE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          file=k8s/deployment.yaml
          grep -q 'image: ghcr.io/unorouter/uno-import:' "$file"
          # tag for people, digest for the cluster: a re-pushed tag cannot change what runs
          [[ "$IMAGE_DIGEST" == sha256:* ]] || { echo "::error::no image digest"; exit 1; }
          sed -i "s|image: ghcr.io/unorouter/uno-import:.*|image: ghcr.io/unorouter/uno-import:$IMAGE_SHA@$IMAGE_DIGEST|" "$file"
          git config user.name unorouter-ci
          git config user.email ci@unorouter.com
          git add "$file"
          git diff --cached --quiet && exit 0
          git commit -m "deploy(uno-import): $IMAGE_SHA"
          for attempt in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1
