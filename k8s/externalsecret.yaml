# Runtime env from OpenBao. Only a reference by key -- no secret value lives in
# this repo. secret/uno-cards-env holds the PIA credential (copied from
# secret/gluetun-env) plus API_TOKEN, the shared secret unorouter presents.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uno-cards-env
  namespace: services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: uno-cards-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: uno-cards-env
---
# The cluster-wide ghcr-pull credential is scoped to the older packages and 403s
# on this one, while the push credential resolves it. A new GHCR package is
# private until changed by hand in the web UI, and the REST API exposes no way
# to flip it, so the image needs a credential rather than public visibility.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uno-cards-pull
  namespace: services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: uno-cards-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: uno-cards-pull
        property: .dockerconfigjson
