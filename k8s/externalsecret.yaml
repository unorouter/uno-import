# Runtime env from OpenBao. Only a reference by key -- no secret value lives in
# this repo. secret/uno-cards-env holds the PIA credential (copied from
# secret/gluetun-env) plus API_TOKEN, the shared secret unorouter presents.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uno-cards-env
  namespace: services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: uno-cards-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: uno-cards-env
