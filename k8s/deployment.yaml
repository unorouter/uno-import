apiVersion: v1
kind: Service
metadata:
  name: uno-import
  namespace: uno-import
spec:
  selector: { app: uno-import }
  ports:
    - port: 4000
      targetPort: 4000
---
# Reaching gluetun's control server unauthenticated requires this file. Without
# it every rotate call answers "Unauthorized" and silently does nothing: the exit
# IP never changes, so the rotation loop burns its rolls against one address and
# reports the provider as dead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: uno-import-gluetun-auth
  namespace: uno-import
data:
  config.toml: |
    [[roles]]
    name = "cards"
    routes = ["GET /v1/publicip/ip", "GET /v1/vpn/status", "PUT /v1/vpn/status"]
    auth = "none"
---
# PIA's own Netherlands config, resolved on every container start. gluetun's
# hardcoded PIA list went stale twice in a week (2026-11-19, 2026-11-25: every
# 158.173.x server it knew was retired, newest image included), while PIA's
# hostname always points at live servers. gluetun's custom provider takes only
# an IP on the remote line, hence the start script.
apiVersion: v1
kind: ConfigMap
metadata:
  name: uno-import-pia
  namespace: uno-import
data:
  start.sh: |
    #!/bin/sh
    set -e
    IP=$(nslookup nl-amsterdam.privacy.network | awk '/^Address/ && $NF !~ /[:#]/ {print $NF}' | shuf -n1)
    [ -n "$IP" ] || { echo "cannot resolve nl-amsterdam.privacy.network"; exit 1; }
    echo "PIA endpoint $IP"
    sed "s/^remote .*/remote $IP 1197/" /pia/netherlands.ovpn > /tmp/custom.conf
    exec /gluetun-entrypoint
  netherlands.ovpn: |
    client
    dev tun
    proto udp
    remote nl-amsterdam.privacy.network 1197
    resolv-retry infinite
    nobind
    persist-key
    persist-tun
    cipher aes-256-cbc
    auth sha256
    tls-client
    remote-cert-tls server

    auth-user-pass
    compress
    verb 1
    reneg-sec 0

