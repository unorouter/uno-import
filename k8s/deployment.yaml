apiVersion: v1
kind: Service
metadata:
  name: uno-import
  namespace: services
spec:
  selector: { app: uno-import }
  ports:
    - port: 4000
      targetPort: 4000
---
# Reaching gluetun's control server unauthenticated requires this file. Without
# it every rotate call answers "Unauthorized" and silently does nothing: the exit
# IP never changes, so the rotation loop burns its rolls against one address and
# reports the provider as dead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: uno-import-gluetun-auth
  namespace: services
data:
  config.toml: |
    [[roles]]
    name = "cards"
    routes = ["GET /v1/publicip/ip", "GET /v1/vpn/status", "PUT /v1/vpn/status"]
    auth = "none"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uno-import
  namespace: services
spec:
  # ONE browser and ONE tunnel. A second replica would rotate the exit out from
  # under the other's in-flight page load.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: uno-import }
  template:
    metadata:
      labels: { app: uno-import }
    spec:
      # NOT the cluster-wide ghcr-pull secret: that credential 403s on this
      # package while the push credential resolves it, so uno-import-pull is built
      # from the latter. The kubelet pulls anonymously otherwise, and a new GHCR
      # package is private until flipped by hand in the web UI.
      imagePullSecrets:
        - name: uno-import-pull
      # Lets dumb-init see chrome's orphans across containers in the pod.
      shareProcessNamespace: true
      containers:
        - name: vpn
          image: qmcgaw/gluetun:v3.40
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "private internet access"
            - name: VPN_TYPE
              value: openvpn
            - name: OPENVPN_USER
              valueFrom:
                { secretKeyRef: { name: uno-import-env, key: OPENVPN_USER } }
            - name: OPENVPN_PASSWORD
              valueFrom:
                { secretKeyRef: { name: uno-import-env, key: OPENVPN_PASSWORD } }
            - name: HTTP_CONTROL_SERVER_ADDRESS
              value: ":8000"
            # The kill-switch drops everything not bound for the tunnel, and that
            # includes REPLIES to callers inside the cluster: without these
            # subnets the API answers on localhost while every request from
            # another pod or from the kubelet times out against a healthy server.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16"
            # Inbound arrives on eth0; replies must leave the same way rather
            # than following the default route into the tunnel.
            - name: FIREWALL_INPUT_PORTS
              value: "4000"
            - name: DNS_KEEP_NAMESERVER
              value: "on"
          volumeMounts:
            - name: gluetun-auth
              mountPath: /gluetun/auth
          resources:
            requests: { memory: 64Mi, cpu: 20m }
            limits: { memory: 256Mi }
        - name: api
          # pinned by build-local.sh; ArgoCD rolls it out. Never :latest, a
          # floating tag never changes the manifest so no deploy happens.
          image: ghcr.io/unorouter/uno-import:115004058ed6a7144c222392dad2695096fba880
          env:
            - name: API_TOKEN
              valueFrom:
                { secretKeyRef: { name: uno-import-env, key: API_TOKEN } }
          envFrom:
            - secretRef: { name: uno-import-env }
          ports:
            - containerPort: 4000
          # Chrome needs real shared memory; the 64MB default causes it to crash
          # mid-render and orphan its process tree.
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests: { memory: 512Mi, cpu: 200m }
            limits: { memory: 2Gi }
          # exec, not httpGet: the kubelet probes the POD IP, and replies to it
          # route back out through the tunnel and never arrive, so an httpGet
          # probe times out against a server that answers fine on localhost. The
          # pod then sits at 1/2 Ready with nothing wrong with it.
          # timeoutSeconds MUST exceed the curl -m 5 it runs: the probe's own default
          # is 1s, so the kubelet killed the check ("command timed out") while curl was
          # still waiting on a health handler that blocks during a tunnel reroll. That
          # dropped readiness to 0 on a pod with nothing wrong and paged
          # DeploymentNoReplicas.
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -sf -m 5 http://127.0.0.1:4000/api/health"]
            timeoutSeconds: 8
            periodSeconds: 15
            failureThreshold: 3
          # Startup rolls the tunnel until an exit loads the targets, which can take a
          # few minutes. A startupProbe holds readiness AND liveness off until the first
          # success, so that search cannot register as an outage or get killed halfway.
          startupProbe:
            exec:
              command: ["sh", "-c", "curl -sf -m 5 http://127.0.0.1:4000/api/health"]
            timeoutSeconds: 8
            periodSeconds: 15
            failureThreshold: 40   # up to 10min of rerolling
          livenessProbe:
            exec:
              command: ["sh", "-c", "curl -sf -m 5 http://127.0.0.1:4000/api/health"]
            timeoutSeconds: 8
            periodSeconds: 60
            failureThreshold: 5
      volumes:
        - name: gluetun-auth
          configMap: { name: uno-import-gluetun-auth }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
